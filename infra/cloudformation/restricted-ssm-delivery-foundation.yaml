AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and fixed SSM Command delivery add-on for the restricted Threadia EC2 host.

Parameters:
  NetworkStackName:
    Type: String
    AllowedPattern: '^[A-Za-z][A-Za-z0-9-]{0,127}$'
  ExistingEc2InstanceId:
    Type: String
    Description: Exact existing DeliveryHost instance ID.
    AllowedPattern: '^i-[a-z0-9]+$'
  ExistingEc2RoleName:
    Type: String
    Description: Existing restricted compute EC2 role name.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,64}$'
  ArtifactNoncurrentVersionRetentionDays:
    Type: Number
    Default: 30
    MinValue: 7
    MaxValue: 365
  HelperArtifactKey:
    Type: String
    Description: Approved immutable S3 key for the root-owned release helper.
    AllowedPattern: '^releases/[0-9a-f]{40}/[0-9]+-[0-9]+/apply-release$'
  HelperArtifactVersionId:
    Type: String
    Description: Exact approved S3 VersionId for the release helper artifact.
    AllowedPattern: '^[A-Za-z0-9._+=/-]{1,1000}[A-Za-z0-9._+=/-]{0,24}$'
  HelperArtifactSha256:
    Type: String
    Description: Approved SHA-256 digest for the exact release helper artifact version.
    AllowedPattern: '^[a-f0-9]{64}$'

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList: [sts.amazonaws.com]
      Url: https://token.actions.githubusercontent.com
      Tags:
        - Key: Project
          Value: Threadia
        - Key: Environment
          Value: restricted-nonprod
        - Key: ManagedBy
          Value: CloudFormation
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub threadia-restricted-${AWS::AccountId}-${AWS::Region}-artifacts
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentReleaseVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref ArtifactNoncurrentVersionRetentionDays
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: Threadia
        - Key: Environment
          Value: restricted-nonprod
        - Key: ManagedBy
          Value: CloudFormation
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Exact GitHub Environment OIDC role for immutable S3 releases and the fixed SSM document.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:SEUIL/Threadia:environment:restricted-nonprod
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: PublishImmutableReleaseAndInvokeFixedDocument
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PutOnlyImmutableReleaseObjects
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/releases/*
              - Sid: InvokeOnlyTheFixedDocumentOnTheExactHost
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ReleaseCommandDocument}
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/threadia-restricted-ssm-delivery-helper-maintenance-v2
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ExistingEc2InstanceId}
              - Sid: ReadOnlyOwnCommandInvocationStatus
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
      Tags:
        - Key: Project
          Value: Threadia
        - Key: Environment
          Value: restricted-nonprod
        - Key: ManagedBy
          Value: CloudFormation
  ExistingEc2DeliveryPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-artifact-and-runtime-parameters
      Roles: [!Ref ExistingEc2RoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadVersionedReleaseOnlyThroughPrivateS3Endpoint
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub ${ArtifactBucket.Arn}/releases/*
            Condition:
              StringEquals:
                aws:SourceVpce:
                  Fn::ImportValue: !Sub ${NetworkStackName}-S3GatewayEndpointId
          - Sid: ReadExactRuntimeSecureStringParametersOnly
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters]
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_DB_URL
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_DB_USERNAME
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_DB_PASSWORD
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_JWT_SECRET
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_COOKIE_SECURE
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/THREADIA_CORS_ALLOWED_ORIGIN
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/MAIL_HOST
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/MAIL_PORT
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/MAIL_USERNAME
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/MAIL_PASSWORD
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/threadia/restricted-nonprod/runtime/NOTIFICATION_FROM_EMAIL
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowGitHubRoleToPutReleaseObjects
            Effect: Allow
            Principal:
              AWS: !GetAtt GitHubDeployRole.Arn
            Action: s3:PutObject
            Resource: !Sub ${ArtifactBucket.Arn}/releases/*
          - Sid: AllowExactEc2RoleToReadOnlyViaPrivateS3Endpoint
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ExistingEc2RoleName}
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub ${ArtifactBucket.Arn}/releases/*
            Condition:
              StringEquals:
                aws:SourceVpce:
                  Fn::ImportValue: !Sub ${NetworkStackName}-S3GatewayEndpointId
  ReleaseCommandDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Download and atomically activate one immutable Threadia release through the fixed host helper (document revision 2).
        parameters:
          ArtifactKey:
            type: String
            allowedPattern: '^releases/[0-9a-f]{40}/[0-9]+-[0-9]+/threadia-release-[0-9a-f]{40}-[0-9]+-[0-9]+\.tar\.gz$'
          ArtifactVersionId:
            type: String
            allowedPattern: '^[A-Za-z0-9._+=/-]{1,1000}[A-Za-z0-9._+=/-]{0,24}$'
          ArtifactSha256:
            type: String
            allowedPattern: '^[a-f0-9]{64}$'
          ReleaseId:
            type: String
            allowedPattern: '^[0-9a-f]{40}-[0-9]+-[0-9]+$'
        mainSteps:
          - action: aws:runShellScript
            name: ApplyImmutableRelease
            inputs:
              timeoutSeconds: '540'
              runCommand:
                - !Sub >-
                  AWS_REGION='${AWS::Region}' AWS_DEFAULT_REGION='${AWS::Region}'
                  /usr/local/lib/threadia-release/apply-release
                  '${ArtifactBucket}' '{{ ArtifactKey }}' '{{ ArtifactVersionId }}'
                  '{{ ArtifactSha256 }}' '{{ ReleaseId }}'
  HelperMaintenanceCommandDocumentV2:
    Type: AWS::SSM::Document
    Properties:
      Name: threadia-restricted-ssm-delivery-helper-maintenance-v2
      UpdateMethod: NewVersion
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Atomically install the CloudFormation-pinned release helper without service or Parameter Store access.
        mainSteps:
          - action: aws:runShellScript
            name: InstallPinnedReleaseHelper
            inputs:
              runCommand:
                - !Sub |
                    set -euo pipefail
                    readonly TARGET=/usr/local/lib/threadia-release/apply-release
                    readonly HOST_LOCK=/run/threadia-release-maintenance.lock
                    success=false
                    backup_ready=false
                    [[ "$(id -u)" -eq 0 ]]
                    for command in aws sha256sum bash install mv mktemp flock cp; do
                      command -v "$command" >/dev/null 2>&1
                    done
                    exec 9>"$HOST_LOCK"
                    flock -n 9 || { printf '%s\n' 'another release or helper maintenance operation is active' >&2; exit 1; }
                    readonly DOWNLOAD="$(mktemp /usr/local/lib/threadia-release/.apply-release.download.XXXXXX)"
                    readonly STAGED="$(mktemp /usr/local/lib/threadia-release/.apply-release.install.XXXXXX)"
                    readonly BACKUP="$(mktemp /usr/local/lib/threadia-release/.apply-release.backup.XXXXXX)"

                    cleanup() {
                      rm -f "$DOWNLOAD" "$STAGED" "$BACKUP"
                    }

                    restore() {
                      local status="$1"
                      trap - ERR INT TERM EXIT
                      if [[ "$success" != true && "$backup_ready" == true && -f "$BACKUP" ]]; then
                        mv -Tf "$BACKUP" "$TARGET"
                      fi
                      cleanup
                      exit "$status"
                    }

                    trap 'restore "$?"' ERR EXIT
                    trap 'restore 130' INT
                    trap 'restore 143' TERM
                    umask 027
                    [[ -f "$TARGET" ]]
                    aws s3api get-object --region '${AWS::Region}' --bucket '${ArtifactBucket}' --key '${HelperArtifactKey}' --version-id '${HelperArtifactVersionId}' "$DOWNLOAD" >/dev/null
                    [[ "$(sha256sum "$DOWNLOAD" | cut -d ' ' -f1)" == '${HelperArtifactSha256}' ]]
                    bash -n "$DOWNLOAD"
                    install -o root -g root -m 0750 "$DOWNLOAD" "$STAGED"
                    [[ "$(sha256sum "$STAGED" | cut -d ' ' -f1)" == '${HelperArtifactSha256}' ]]
                    bash -n "$STAGED"
                    cp -p "$TARGET" "$BACKUP"
                    backup_ready=true
                    mv -Tf "$STAGED" "$TARGET"
                    [[ "$(sha256sum "$TARGET" | cut -d ' ' -f1)" == '${HelperArtifactSha256}' ]]
                    bash -n "$TARGET"
                    success=true
                    trap - ERR INT TERM EXIT
                    cleanup
  HelperMaintenanceCommandDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS::EC2::Instance
      Content:
        schemaVersion: '2.2'
        description: Atomically install the CloudFormation-pinned release helper without service or Parameter Store access.
        mainSteps:
          - action: aws:runShellScript
            name: InstallPinnedReleaseHelper
            inputs:
              runCommand:
                - !Sub |
                    set -euo pipefail
                    readonly TARGET=/usr/local/lib/threadia-release/apply-release
                    readonly HOST_LOCK=/run/threadia-release-maintenance.lock
                    success=false
                    backup_ready=false
                    [[ "$(id -u)" -eq 0 ]]
                    for command in aws sha256sum bash install mv mktemp flock cp; do
                      command -v "$command" >/dev/null 2>&1
                    done
                    exec 9>"$HOST_LOCK"
                    flock -n 9 || { printf '%s\n' 'another release or helper maintenance operation is active' >&2; exit 1; }
                    readonly DOWNLOAD="$(mktemp /usr/local/lib/threadia-release/.apply-release.download.XXXXXX)"
                    readonly STAGED="$(mktemp /usr/local/lib/threadia-release/.apply-release.install.XXXXXX)"
                    readonly BACKUP="$(mktemp /usr/local/lib/threadia-release/.apply-release.backup.XXXXXX)"

                    cleanup() {
                      rm -f "$DOWNLOAD" "$STAGED" "$BACKUP"
                    }

                    restore() {
                      local status="$1"
                      trap - ERR INT TERM EXIT
                      if [[ "$success" != true && "$backup_ready" == true && -f "$BACKUP" ]]; then
                        mv -Tf "$BACKUP" "$TARGET"
                      fi
                      cleanup
                      exit "$status"
                    }

                    trap 'restore "$?"' ERR EXIT
                    trap 'restore 130' INT
                    trap 'restore 143' TERM
                    umask 027
                    [[ -f "$TARGET" ]]
                    aws s3api get-object --region '${AWS::Region}' --bucket '${ArtifactBucket}' --key 'releases/97d6f8789280336f9cb2f72a786e57b95d915f19/29418381683-1/apply-release' --version-id 'jLhUyDqaJxl7LYwMMSIGFmLka4UtqCwe' "$DOWNLOAD" >/dev/null
                    [[ "$(sha256sum "$DOWNLOAD" | cut -d ' ' -f1)" == '586e284d82f5a0f9496b8201257efca7e1502344357567b420a21d8a51ac3b68' ]]
                    bash -n "$DOWNLOAD"
                    install -o root -g root -m 0750 "$DOWNLOAD" "$STAGED"
                    [[ "$(sha256sum "$STAGED" | cut -d ' ' -f1)" == '586e284d82f5a0f9496b8201257efca7e1502344357567b420a21d8a51ac3b68' ]]
                    bash -n "$STAGED"
                    cp -p "$TARGET" "$BACKUP"
                    backup_ready=true
                    mv -Tf "$STAGED" "$TARGET"
                    [[ "$(sha256sum "$TARGET" | cut -d ' ' -f1)" == '586e284d82f5a0f9496b8201257efca7e1502344357567b420a21d8a51ac3b68' ]]
                    bash -n "$TARGET"
                    success=true
                    trap - ERR INT TERM EXIT
                    cleanup
Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  ReleaseCommandDocumentName:
    Value: !Ref ReleaseCommandDocument
  HelperMaintenanceCommandDocumentName:
    Value: !Ref HelperMaintenanceCommandDocument
  RuntimeParameterNames:
    Description: Exact SecureString names that the approved platform owner must create and rotate outside this template.
    Value: /threadia/restricted-nonprod/runtime/{THREADIA_DB_URL,THREADIA_DB_USERNAME,THREADIA_DB_PASSWORD,THREADIA_JWT_SECRET,THREADIA_COOKIE_SECURE,THREADIA_CORS_ALLOWED_ORIGIN}
