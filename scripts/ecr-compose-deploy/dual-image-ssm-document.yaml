schemaVersion: '2.2'
description: Fixed public dual-image Compose deployment command.
parameters:
  ReleaseId: {type: String, interpolationType: ENV_VAR, allowedPattern: '^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$'}
  FrontendImageRef: {type: String, interpolationType: ENV_VAR, allowedPattern: '^940507692158\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/threadia-frontend@sha256:[a-f0-9]{64}$'}
  BackendImageRef: {type: String, interpolationType: ENV_VAR, allowedPattern: '^940507692158\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/threadia-backend@sha256:[a-f0-9]{64}$'}
mainSteps:
  - action: aws:runShellScript
    name: deploy
    inputs:
      timeoutSeconds: '540'
      runCommand: ['exec /usr/local/lib/threadia-compose/deploy-dual-release "$SSM_ReleaseId" "$SSM_FrontendImageRef" "$SSM_BackendImageRef"']
