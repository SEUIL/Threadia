services:
  mysql:
    image: mysql:8.4
    container_name: threadia-mysql84
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ${THREADIA_DB_NAME:-threadia_test}
      MYSQL_USER: ${THREADIA_DB_USERNAME:-threadia}
      MYSQL_PASSWORD: ${THREADIA_DB_PASSWORD:?THREADIA_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${THREADIA_DB_ROOT_PASSWORD:?THREADIA_DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
