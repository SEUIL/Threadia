import java.nio.channels.FileChannel
import java.nio.channels.FileLock
import java.nio.file.Files
import java.nio.file.StandardOpenOption

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.threadia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation platform('software.amazon.awssdk:bom:2.39.3')
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
	testImplementation 'org.testcontainers:testcontainers:1.21.3'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

def testExecutionLockChannel
def testExecutionFileLock
def releaseTestExecutionLock = {
	if (testExecutionFileLock != null && testExecutionFileLock.isValid()) {
		testExecutionFileLock.release()
	}
	if (testExecutionLockChannel != null && testExecutionLockChannel.isOpen()) {
		testExecutionLockChannel.close()
	}
}

// Separate Gradle processes otherwise race on build/test-results/test/binary and corrupt XML generation.
gradle.taskGraph.whenReady { taskGraph ->
	if (taskGraph.hasTask(tasks.named('test').get())) {
		def lockPath = layout.projectDirectory.file('.gradle/threadia-test-execution.lock').asFile.toPath()
		Files.createDirectories(lockPath.parent)
		testExecutionLockChannel = FileChannel.open(
				lockPath,
				StandardOpenOption.CREATE,
				StandardOpenOption.WRITE)
		testExecutionFileLock = testExecutionLockChannel.lock()
	}
}

gradle.buildFinished {
	releaseTestExecutionLock()
}
