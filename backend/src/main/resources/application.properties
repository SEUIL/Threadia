spring.application.name=backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.datasource.url=${THREADIA_DB_URL:jdbc:mysql://localhost:3307/threadia_test}
spring.datasource.username=${THREADIA_DB_USERNAME:threadia}
spring.datasource.password=${THREADIA_DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=0
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# access token 30분(1800초) 확정 정책. secret은 THREADIA_JWT_SECRET 환경변수로만 주입한다.
threadia.jwt.secret=${THREADIA_JWT_SECRET:}
threadia.jwt.access-token-expiration-seconds=1800
# 운영 환경(HTTPS)에서는 THREADIA_COOKIE_SECURE=true로 설정한다.
threadia.cookie.secure=${THREADIA_COOKIE_SECURE:false}
# refresh token 쿠키 Max-Age이자 DB expiresAt 계산 기준(14일, 1209600초) 확정 정책.
threadia.refresh-token.expiration-days=${THREADIA_REFRESH_TOKEN_EXPIRATION_DAYS:14}

# Google OAuth callback 이후 frontend redirect 대상. secret 값은 .env에만 둔다.
threadia.oauth.success-redirect-url=${THREADIA_OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/hub}
threadia.oauth.failure-redirect-url=${THREADIA_OAUTH_FAILURE_REDIRECT_URL:http://localhost:3000/login?oauth=failed}
# CORS 허용 origin. frontend(Next.js) 기본 로컬 개발 주소. 운영에서는 실제 도메인으로 덮어쓴다.
threadia.cors.allowed-origin=${THREADIA_CORS_ALLOWED_ORIGIN:http://localhost:3000}
