services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${THREADIA_MINIO_ROOT_USER:?THREADIA_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${THREADIA_MINIO_ROOT_PASSWORD:?THREADIA_MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$${THREADIA_STORAGE_S3_BUCKET:-threadia-private};
      mc anonymous set none local/$${THREADIA_STORAGE_S3_BUCKET:-threadia-private}"
    environment:
      MINIO_ROOT_USER: ${THREADIA_MINIO_ROOT_USER:?THREADIA_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${THREADIA_MINIO_ROOT_PASSWORD:?THREADIA_MINIO_ROOT_PASSWORD is required}
volumes:
  minio-data:
