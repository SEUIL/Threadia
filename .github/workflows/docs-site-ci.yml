name: docs-site-ci

on:
  pull_request:
    paths:
      - "docs-site/**"
      - "docs/00-project/**"
      - "docs/02-requirements/**"
      - "docs/03-design/**"
      - "docs/04-api/**"
      - "docs/05-architecture/**"
      - "docs/06-meetings/**"
      - "docs/07-decisions/**"
      - ".github/workflows/docs-site-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "docs-site/**"
      - "docs/00-project/**"
      - "docs/02-requirements/**"
      - "docs/03-design/**"
      - "docs/04-api/**"
      - "docs/05-architecture/**"
      - "docs/06-meetings/**"
      - "docs/07-decisions/**"
      - ".github/workflows/docs-site-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Docs-site lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
