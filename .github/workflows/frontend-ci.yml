name: frontend-ci

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  # PR #173 4차 재리뷰(pktewon) blocker 5 반영 — 이전엔 lint/build만 돌고
  # Playwright smoke는 로컬에서만 수동으로 확인했다. DM 화면은 race condition
  # 회귀가 반복적으로 나왔던 영역이라(#173 자체가 그 이력이다) 핵심 DM smoke만
  # 이 merge gate에 포함시킨다(전체 smoke 스위트는 범위 밖 — 실행 시간 부담).
  dm-smoke:
    name: DM smoke (dev server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run DM smoke
        run: npx playwright test tests/smoke/dm.spec.ts

  # tests/smoke-production/은 production 빌드(React Strict Mode 없음)에서만
  # 결정적으로 재현되는 mount-order race를 검증한다 — dm-mount-race.spec.ts
  # 헤더 주석 참고. dev 서버로는 이 회귀들을 안정적으로 못 잡는다(blocker 5).
  dm-mount-race-smoke:
    name: DM mount-race smoke (production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run DM mount-race smoke (builds standalone server first)
        run: npm run test:smoke:production
