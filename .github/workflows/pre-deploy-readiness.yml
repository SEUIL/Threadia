name: pre-deploy-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      THREADIA_DB_URL: jdbc:mysql://127.0.0.1:3306/threadia_readiness
      THREADIA_DB_USERNAME: threadia_readiness
      THREADIA_DB_PASSWORD: threadia_readiness_password
      THREADIA_DB_SCHEMA_VALIDATION: "true"
      THREADIA_JWT_SECRET: ci-only-jwt-secret-not-for-production-please-replace
      THREADIA_PROJECT_CHAT_CURSOR_HMAC_SECRET: ci-only-project-chat-cursor-secret-not-for-production
      THREADIA_NOTIFICATION_CURSOR_HMAC_SECRET: ci-only-notification-cursor-secret-not-for-production
      THREADIA_AUDIT_CURSOR_HMAC_SECRET: ci-only-audit-cursor-secret-not-for-production
      THREADIA_COOKIE_SECURE: "false"
      THREADIA_CORS_ALLOWED_ORIGIN: http://localhost:3000
      THREADIA_STORAGE_S3_BUCKET: threadia-ci-only-storage
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: threadia_readiness
          MYSQL_USER: threadia_readiness
          MYSQL_PASSWORD: threadia_readiness_password
          MYSQL_ROOT_PASSWORD: threadia_readiness_root_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uthreadia_readiness -pthreadia_readiness_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend tests
        run: ./gradlew test

  frontend-lint-and-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  docs-site-lint-and-build:
    name: Docs-site lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  frontend-smoke:
    name: Frontend smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run test:smoke -- --workers=1
