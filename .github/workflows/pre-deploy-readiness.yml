name: pre-deploy-readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      THREADIA_DB_URL: jdbc:mysql://localhost:3307/threadia_test
      THREADIA_DB_USERNAME: threadia
      THREADIA_DB_PASSWORD: ""
      THREADIA_JWT_SECRET: public-ci-test-jwt-secret-not-for-production-please-replace
      THREADIA_COOKIE_SECURE: "false"
      THREADIA_CORS_ALLOWED_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend tests
        run: ./gradlew test

  frontend-lint-and-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

  docs-site-lint-and-build:
    name: Docs-site lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
