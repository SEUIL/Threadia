name: api-certificate-expiry

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-certificate-expiry:
    name: Check api.threadia.click certificate expiry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Fail when the certificate expires within 30 days
        shell: bash
        run: |
          set -euo pipefail
          host="api.threadia.click"
          check_seconds="$((30 * 24 * 60 * 60))"
          certificate="$(openssl s_client -connect "${host}:443" -servername "$host" </dev/null 2>/dev/null | openssl x509)"

          printf '%s\n' "$certificate" | openssl x509 -noout -enddate
          printf '%s\n' "$certificate" | openssl x509 -checkend "$check_seconds" -noout
