name: restricted-ssm-helper-artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-helper:
    name: Publish immutable release helper artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: restricted-ssm-helper-artifact
      cancel-in-progress: false
    timeout-minutes: 10
    environment: restricted-nonprod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      THREADIA_ARTIFACT_BUCKET: ${{ vars.THREADIA_ARTIFACT_BUCKET }}
    steps:
      - name: Checkout
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate and identify helper artifact
        id: helper
        run: |
          set -euo pipefail
          helper=scripts/ssm-delivery/apply-release
          test -f "$helper"
          bash -n "$helper"
          key="releases/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/apply-release"
          digest="$(sha256sum "$helper" | cut -d ' ' -f1)"
          printf 'key=%s\ndigest=%s\ncommit=%s\nrun=%s-%s\n' "$key" "$digest" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials through OIDC
        # aws-actions/configure-aws-credentials v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload immutable helper artifact
        id: upload
        run: |
          set -euo pipefail
          version_id="$(aws s3api put-object --region "$AWS_REGION" --bucket "$THREADIA_ARTIFACT_BUCKET" --key "${{ steps.helper.outputs.key }}" --body scripts/ssm-delivery/apply-release --server-side-encryption AES256 --query VersionId --output text)"
          [[ -n "$version_id" && "$version_id" != None && "$version_id" != null && "$version_id" =~ ^[A-Za-z0-9._+=/-]{1,1000}[A-Za-z0-9._+=/-]{0,24}$ ]]
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
      - name: Record approval evidence
        run: |
          set -euo pipefail
          printf 'helper_key=%s\nhelper_version_id=%s\nhelper_sha256=%s\ncommit=%s\nrun=%s\n' \
            "${{ steps.helper.outputs.key }}" "${{ steps.upload.outputs.version_id }}" "${{ steps.helper.outputs.digest }}" \
            "${{ steps.helper.outputs.commit }}" "${{ steps.helper.outputs.run }}"
