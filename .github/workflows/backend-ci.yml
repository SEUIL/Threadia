name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "db/**"
      - "scripts/ssm-delivery/**"
      - "infra/cloudformation/**"
      - "docs/00-project/restricted-ssm-*.md"
      - "docs/05-architecture/GitHub-OIDC-SSM-EC2-배포-설계.md"
      - "compose.mysql.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "db/**"
      - "scripts/ssm-delivery/**"
      - "infra/cloudformation/**"
      - "docs/00-project/restricted-ssm-*.md"
      - "docs/05-architecture/GitHub-OIDC-SSM-EC2-배포-설계.md"
      - "compose.mysql.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      THREADIA_DB_URL: jdbc:mysql://127.0.0.1:3306/threadia_ci
      THREADIA_DB_USERNAME: threadia_ci
      THREADIA_DB_PASSWORD: threadia_ci_password
      THREADIA_DB_SCHEMA_VALIDATION: "true"
      THREADIA_JWT_SECRET: public-ci-test-jwt-secret-not-for-production-please-replace
      THREADIA_PROJECT_CHAT_CURSOR_HMAC_SECRET: public-ci-test-project-chat-cursor-hmac-secret-not-for-production
      THREADIA_NOTIFICATION_CURSOR_HMAC_SECRET: public-ci-test-notification-cursor-hmac-secret-not-for-production
      THREADIA_AUDIT_CURSOR_HMAC_SECRET: public-ci-test-audit-cursor-hmac-secret-not-for-production
      THREADIA_COOKIE_SECURE: "false"
      THREADIA_CORS_ALLOWED_ORIGIN: http://localhost:3000

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: threadia_ci
          MYSQL_USER: threadia_ci
          MYSQL_PASSWORD: threadia_ci_password
          MYSQL_ROOT_PASSWORD: threadia_ci_root_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uthreadia_ci -pthreadia_ci_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate additive Platform foundation migration
        run: |
          python3 ../infra/cloudformation/test-platform-foundation-additive-migration.py
          python3 ../infra/cloudformation/test-attachment-storage-additive-migration.py

      - name: Validate packaged backend against additive Phase 1 schema
        run: ./gradlew test --tests com.threadia.backend.JpaSchemaValidationTests

      - name: Validate restricted SSM delivery source
        run: |
          bash -n ../scripts/ssm-delivery/apply-release
          python3 ../infra/cloudformation/test-optional-mail-runtime-parser.py
          python3 ../infra/cloudformation/validate-restricted-ssm-delivery-preflight.py

      - name: Run backend tests
        run: ./gradlew test
