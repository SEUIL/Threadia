name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - "db/**"
      - "compose.mysql.yml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "backend/**"
      - "db/**"
      - "compose.mysql.yml"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      THREADIA_DB_URL: jdbc:mysql://127.0.0.1:3306/threadia_ci
      THREADIA_DB_USERNAME: threadia_ci
      THREADIA_DB_PASSWORD: threadia_ci_password
      THREADIA_DB_SCHEMA_VALIDATION: "true"
      THREADIA_JWT_SECRET: public-ci-test-jwt-secret-not-for-production-please-replace
      THREADIA_PROJECT_CHAT_CURSOR_HMAC_SECRET: public-ci-test-project-chat-cursor-hmac-secret-not-for-production
      THREADIA_NOTIFICATION_CURSOR_HMAC_SECRET: public-ci-test-notification-cursor-hmac-secret-not-for-production
      THREADIA_AUDIT_CURSOR_HMAC_SECRET: public-ci-test-audit-cursor-hmac-secret-not-for-production
      THREADIA_COOKIE_SECURE: "false"
      THREADIA_CORS_ALLOWED_ORIGIN: http://localhost:3000

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: threadia_ci
          MYSQL_USER: threadia_ci
          MYSQL_PASSWORD: threadia_ci_password
          MYSQL_ROOT_PASSWORD: threadia_ci_root_password
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uthreadia_ci -pthreadia_ci_password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize MySQL schema
        run: MYSQL_PWD="$THREADIA_DB_PASSWORD" mysql --host=127.0.0.1 --port=3306 --user="$THREADIA_DB_USERNAME" threadia_ci < ../db/schema.sql

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run backend tests
        run: ./gradlew test
