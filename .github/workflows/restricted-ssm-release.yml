name: restricted-ssm-release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/restricted-ssm-release.yml

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build immutable release and invoke fixed SSM document
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: restricted-ssm-host-change
      cancel-in-progress: false
    timeout-minutes: 30
    environment: restricted-nonprod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      THREADIA_ARTIFACT_BUCKET: ${{ vars.THREADIA_ARTIFACT_BUCKET }}
      THREADIA_DELIVERY_INSTANCE_ID: ${{ vars.THREADIA_DELIVERY_INSTANCE_ID }}
      THREADIA_SSM_DOCUMENT_NAME: ${{ vars.THREADIA_SSM_DOCUMENT_NAME }}
    steps:
      - name: Checkout
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Java 17
        # actions/setup-java v4.8.0
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build backend JAR
        working-directory: backend
        run: ./gradlew clean bootJar
      - name: Package immutable release
        id: release
        run: |
          set -euo pipefail
          jar_path="$(find backend/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_path"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive="threadia-release-${release_id}.tar.gz"
          stage="$(mktemp -d)"
          cp "$jar_path" "$stage/app.jar"
          test -x "$JAVA_HOME/bin/java"
          cp -aL "$JAVA_HOME" "$stage/runtime"
          test ! -L "$stage/runtime"
          sha256sum "$stage/app.jar" | cut -d ' ' -f1 > "$stage/app.jar.sha256"
          python3 - "$stage/manifest.json" "$release_id" <<'PY'
          import json
          import sys
          with open(sys.argv[1], "w", encoding="utf-8") as target:
              json.dump({"releaseId": sys.argv[2]}, target, separators=(",", ":"))
          PY
          tar -C "$stage" -czf "$archive" app.jar app.jar.sha256 manifest.json runtime
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
          key="releases/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${archive}"
          printf 'archive=%s\narchive_sha=%s\nkey=%s\nrelease_id=%s\n' "$archive" "$archive_sha" "$key" "$release_id" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials through OIDC
        # aws-actions/configure-aws-credentials v4.3.1
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload versioned release and invoke fixed command
        id: command
        run: |
          set -euo pipefail
          version_id="$(aws s3api put-object --region "$AWS_REGION" --bucket "$THREADIA_ARTIFACT_BUCKET" --key "${{ steps.release.outputs.key }}" --body "${{ steps.release.outputs.archive }}" --server-side-encryption AES256 --query VersionId --output text)"
          test "$version_id" != "None"
          command_id="$(aws ssm send-command --region "$AWS_REGION" --document-name "$THREADIA_SSM_DOCUMENT_NAME" --instance-ids "$THREADIA_DELIVERY_INSTANCE_ID" --parameters ArtifactKey="${{ steps.release.outputs.key }}",ArtifactVersionId="$version_id",ArtifactSha256="${{ steps.release.outputs.archive_sha }}",ReleaseId="${{ steps.release.outputs.release_id }}" --query Command.CommandId --output text)"
          printf 'command_id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"
      - name: Verify fixed command completion
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if ! status="$(aws ssm get-command-invocation --region "$AWS_REGION" --cli-connect-timeout 5 --cli-read-timeout 10 --command-id "${{ steps.command.outputs.command_id }}" --instance-id "$THREADIA_DELIVERY_INSTANCE_ID" --query Status --output text 2>/dev/null)"; then
              status=Pending
            fi
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling) exit 1 ;;
            esac
            sleep 10
          done
          exit 1
