name: ecr-compose-nonprod

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Publish dual images and reset the public Compose database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ecr-compose-nonprod
      cancel-in-progress: false
    timeout-minutes: 30
    environment: ecr-compose-nonprod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      THREADIA_ECR_REGISTRY: ${{ vars.THREADIA_ECR_REGISTRY }}
      THREADIA_ECR_BACKEND_REPOSITORY: ${{ vars.THREADIA_ECR_BACKEND_REPOSITORY }}
      THREADIA_ECR_FRONTEND_REPOSITORY: ${{ vars.THREADIA_ECR_FRONTEND_REPOSITORY }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      THREADIA_COMPOSE_HOST: ${{ vars.THREADIA_COMPOSE_HOST }}
      THREADIA_COMPOSE_USER: ${{ vars.THREADIA_COMPOSE_USER }}
      THREADIA_COMPOSE_DIRECTORY: ${{ vars.THREADIA_COMPOSE_DIRECTORY }}
      THREADIA_IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.THREADIA_ECR_REGISTRY }}/${{ env.THREADIA_ECR_BACKEND_REPOSITORY }}:${{ env.THREADIA_IMAGE_TAG }}
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: ${{ env.THREADIA_ECR_REGISTRY }}/${{ env.THREADIA_ECR_FRONTEND_REPOSITORY }}:${{ env.THREADIA_IMAGE_TAG }}
      - name: Configure public compose host SSH
        env:
          THREADIA_COMPOSE_SSH_KEY: ${{ secrets.THREADIA_COMPOSE_SSH_KEY }}
          THREADIA_COMPOSE_SSH_KNOWN_HOSTS: ${{ secrets.THREADIA_COMPOSE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$THREADIA_COMPOSE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$THREADIA_COMPOSE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Sync compose and schema artifacts to the host
        run: |
          set -euo pipefail
          target="${THREADIA_COMPOSE_USER}@${THREADIA_COMPOSE_HOST}"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "install -d -m 0755 '${THREADIA_COMPOSE_DIRECTORY}/db'"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes compose.ecr-nonprod.yml "$target:${THREADIA_COMPOSE_DIRECTORY}/compose.ecr-nonprod.yml.next"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes db/schema.sql "$target:${THREADIA_COMPOSE_DIRECTORY}/db/schema.sql.next"
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mv '${THREADIA_COMPOSE_DIRECTORY}/compose.ecr-nonprod.yml.next' '${THREADIA_COMPOSE_DIRECTORY}/compose.ecr-nonprod.yml' && mv '${THREADIA_COMPOSE_DIRECTORY}/db/schema.sql.next' '${THREADIA_COMPOSE_DIRECTORY}/db/schema.sql'"
      - name: Pull images, reset database, recreate Compose services, and verify backend health
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes "${THREADIA_COMPOSE_USER}@${THREADIA_COMPOSE_HOST}" bash -s -- "${AWS_REGION}" "${THREADIA_ECR_REGISTRY}" "${THREADIA_ECR_BACKEND_REPOSITORY}" "${THREADIA_ECR_FRONTEND_REPOSITORY}" "${THREADIA_IMAGE_TAG}" "${THREADIA_COMPOSE_DIRECTORY}" <<'REMOTE'
          set -euo pipefail
          aws_region="$1"
          ecr_registry="$2"
          backend_repository="$3"
          frontend_repository="$4"
          image_tag="$5"
          compose_directory="$6"

          cd "$compose_directory"
          export THREADIA_ECR_REGISTRY="$ecr_registry"
          export THREADIA_ECR_BACKEND_REPOSITORY="$backend_repository"
          export THREADIA_ECR_FRONTEND_REPOSITORY="$frontend_repository"
          export THREADIA_IMAGE_TAG="$image_tag"

          aws ecr get-login-password --region "$aws_region" | docker login --username AWS --password-stdin "$ecr_registry"
          docker compose --env-file .env -f compose.ecr-nonprod.yml pull
          docker compose --env-file .env -f compose.ecr-nonprod.yml down --volumes --remove-orphans
          docker compose --env-file .env -f compose.ecr-nonprod.yml up -d --remove-orphans

          for attempt in $(seq 1 30); do
            if docker compose --env-file .env -f compose.ecr-nonprod.yml exec -T backend curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done

          exit 1
          REMOTE
